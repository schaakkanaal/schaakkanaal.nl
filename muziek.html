
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Muziek | Schaakkanaal</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .music-intro {
      text-align: center;
      padding: 35px 20px;
      background: white;
    }

    .music-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .music-card {
      background: #faf4ec;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.05);
    }

    .music-card h3 {
      margin-top: 0;
      font-size: 1.15rem;
    }

    .music-card audio {
      width: 100%;
      margin-top: 10px;
    }

    .music-card .likes {
      color: #777;
      font-size: .9rem;
      margin-bottom: 0;
    }

    .music-status {
      text-align: center;
      padding: 20px;
    }

    .back-link {
      display: inline-block;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<nav>
  <h2>Schaakkanaal.nl</h2>
  <div>
    <a href="index.html">Home</a>
    <a href="#nummers">Alle nummers</a>
  </div>
</nav>

<header class="music-intro">
  <h1>🎵 Community Muziek</h1>
  <p>
    Meer dan 30 nummers, ontstaan binnen onze eigen community.
    Luister, ontdek en geniet!
  </p>
  <a href="index.html" class="btn back-link">Terug naar de homepage</a>
</header>

<section id="nummers">
  <h2>🎧 Alle nummers</h2>
  <p>De complete verzameling muziek van Schaakkanaal.</p>

  <div id="musicStatus" class="music-status">
    Muzieknummers ophalen...
  </div>

  <div id="musicList" class="music-list"></div>
</section>

<footer>
  <p>Schaakkanaal.nl • Community Muziek</p>
</footer>

<script>
const API = "https://api.schaakkanaal.nl/api";

async function loadSongs() {
  const status = document.getElementById("musicStatus");
  const list = document.getElementById("musicList");

  try {
    const response = await fetch(`${API}/songs`);

    if (!response.ok) {
      throw new Error("De muziek kon niet worden opgehaald.");
    }

    const songs = await response.json();

    status.textContent = songs.length + " nummers gevonden.";

    songs.forEach(song => {
      const card = document.createElement("div");
      card.className = "music-card";

      const title = document.createElement("h3");
      title.textContent = "🎵 " + song.title;

      const audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "none";

      const source = document.createElement("source");
      source.src = encodeURIComponent(song.filename);
      source.type = "audio/mpeg";

      audio.appendChild(source);

      const likes = document.createElement("p");
      likes.className = "likes";
      likes.textContent = "👍 " + song.likes + " likes";

      card.appendChild(title);
      card.appendChild(audio);
      card.appendChild(likes);

      list.appendChild(card);
    });

  } catch (error) {
    status.textContent =
      "Het ophalen van de muziek is niet gelukt. Probeer het later opnieuw.";
    console.error(error);
  }
}

loadSongs();
</script>

</body>
</html>
