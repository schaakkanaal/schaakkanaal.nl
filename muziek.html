
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Muziek | Schaakkanaal</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .music-intro {
      text-align: center;
      padding: 35px 20px;
      background: white;
    }

    .music-container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .music-list {
      display: flex;
      flex-direction: column;
      margin-top: 20px;
    }

    .music-row {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(220px, 320px) 90px;
      align-items: center;
      gap: 20px;
      padding: 12px 10px;
      border-bottom: 1px solid #eeeeee;
    }

    .music-row:last-child {
      border-bottom: none;
    }

    .music-title {
      font-weight: 600;
      color: #292929;
    }

    .music-row audio {
      width: 100%;
      height: 38px;
    }

    .music-likes {
      text-align: right;
      color: #777;
      font-size: .95rem;
      white-space: nowrap;
    }

    .music-status {
      text-align: center;
      padding: 20px;
      color: #777;
    }

    @media (max-width: 650px) {
      .music-container {
        margin: 15px;
        padding: 15px;
      }

      .music-row {
        grid-template-columns: 1fr auto;
        gap: 8px 12px;
      }

      .music-title {
        grid-column: 1;
      }

      .music-row audio {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .music-likes {
        grid-column: 2;
        grid-row: 1;
      }
    }
  </style>
</head>

<body>

<nav>
  <h2>Schaakkanaal.nl</h2>
  <div>
    <a href="index.html">Home</a>
    <a href="#nummers">Alle nummers</a>
  </div>
</nav>

<header class="music-intro">
  <h1>🎵 Community Muziek</h1>
  <p>
    Meer dan 30 nummers, ontstaan binnen onze eigen community.
    Luister, ontdek en geniet!
  </p>
  <a href="index.html" class="btn">Terug naar de homepage</a>
</header>

<main class="music-container" id="nummers">
  <h2>🎧 Alle nummers</h2>
  <p>De complete verzameling muziek van Schaakkanaal.</p>

  <div id="musicStatus" class="music-status">
    Muzieknummers ophalen...
  </div>

  <div id="musicList" class="music-list"></div>
</main>

<footer>
  <p>Schaakkanaal.nl • Community Muziek</p>
</footer>

<script>
const API = "https://api.schaakkanaal.nl/api";

async function loadSongs() {
  const status = document.getElementById("musicStatus");
  const list = document.getElementById("musicList");

  try {
    const response = await fetch(`${API}/songs`);

    if (!response.ok) {
      throw new Error("Muziek ophalen mislukt");
    }

    const songs = await response.json();

    status.textContent = songs.length + " nummers gevonden.";

    songs.forEach(song => {
      const row = document.createElement("div");
      row.className = "music-row";

      const title = document.createElement("div");
      title.className = "music-title";
      title.textContent = "🎵 " + song.title;

      const audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "none";

      const source = document.createElement("source");
      source.src = encodeURIComponent(song.filename);
      source.type = "audio/mpeg";

      audio.appendChild(source);

      const likes = document.createElement("div");
      likes.className = "music-likes";
      likes.textContent = "👍 " + song.likes + " likes";

      row.appendChild(title);
      row.appendChild(audio);
      row.appendChild(likes);

      list.appendChild(row);
    });

  } catch (error) {
    status.textContent =
      "Het ophalen van de muziek is niet gelukt.";
    console.error(error);
  }
}

loadSongs();
</script>

</body>
</html>
